<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Автор</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav>
    <a th:href="@{/authors}">Авторы</a>
    <a th:href="@{/books}">Книги</a>
</nav>

<h1 th:text="${author.id == null} ? 'Новый автор' : 'Редактирование автора'"></h1>

<form method="post" th:action="@{/authors/save}" th:object="${author}">
    <input type="hidden" th:field="*{id}">
    <div class="row">
        <label for="fullName">Имя</label>
        <input th:field="*{fullName}" required maxlength="100">
        <span class="error" th:errors="*{fullName}"></span>
    </div>
    <div class="row">
        <label for="country">Страна</label>
        <input th:field="*{country}" maxlength="50">
        <span class="error" th:errors="*{country}"></span>
    </div>
    <div class="row">
        <label for="birthYear">Год рождения</label>
        <input type="number" th:field="*{birthYear}">
        <span class="error" th:errors="*{birthYear}"></span>
    </div>
    <button type="submit">Сохранить</button>
    <a th:href="@{/authors}">Отмена</a>
</form>
</body>
</html>
