<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Книги</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav>
    <a th:href="@{/authors}">Авторы</a>
    <a th:href="@{/books}">Книги</a>
</nav>

<h1>Книги</h1>
<a th:href="@{/books/new}">Добавить книгу</a>

<table>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Жанр</th>
        <th>Год издания</th>
        <th>Страниц</th>
        <th>Автор</th>
        <th></th>
    </tr>
    <tr th:each="b : ${books}">
        <td th:text="${b.id}"></td>
        <td th:text="${b.title}"></td>
        <td th:text="${b.genre}"></td>
        <td th:text="${b.publishYear}"></td>
        <td th:text="${b.pages}"></td>
        <td th:text="${b.author.fullName}"></td>
        <td>
            <a th:href="@{/books/{id}/edit(id=${b.id})}">Изменить</a>
            <form class="inline" method="post" th:action="@{/books/{id}/delete(id=${b.id})}"
                  onsubmit="return confirm('Удалить книгу?')">
                <button type="submit">Удалить</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
